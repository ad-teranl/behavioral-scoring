services:
  - type: web
    name: behavioral-scoring
    runtime: python
    buildCommand: pip install -r app/requirements.txt
    startCommand: streamlit run app/Inicio.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
